<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_top">
<title>Weekly Schedule</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--navy:#03244d;--navy2:#0a3366;--orange:#dd550c;--ink:#f4f6fa;--mute:#a9b8cf;--line:#1d4478;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--navy:#03244d}}
:root[data-theme="dark"]{--navy:#03244d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--navy);color:var(--ink);font:400 17px/1.35 "Source Sans 3",system-ui,sans-serif;min-height:100vh}
body.clear{background:transparent}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px 6px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.02em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:600 14px "Source Sans 3",sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{padding:12px 24px 28px}
.card{background:var(--navy2);border:1px solid var(--line);border-top:6px solid var(--orange);border-radius:10px;padding:18px 20px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.date{font:700 44px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.cycle{background:var(--orange);color:#fff;border-radius:8px;padding:6px 14px;text-align:center;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.04em}
.cycle b{display:block;font-size:40px;line-height:1}
.theme{margin:12px 0 0;padding:10px 14px;border-left:5px solid var(--orange);background:rgba(221,85,12,.14);border-radius:0 8px 8px 0}
.theme strong{font:700 24px "Barlow Condensed",sans-serif;display:block}
.theme span{color:var(--mute);font-size:15px}
.attire{color:var(--mute);margin:8px 0 0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:22px}
.sec{background:rgba(255,255,255,.05);border-left:5px solid var(--orange);border-radius:0 8px 8px 0;padding:10px 14px 12px}
.sec h3{margin:0;font:700 22px "Barlow Condensed",sans-serif;color:#fff}
.sec .t{color:var(--orange);font-weight:600;font-size:15px;filter:brightness(1.25)}
.sec ul{margin:6px 0 0;padding:0;list-style:none}
.sec li{padding:3px 0}
.week{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:0 12px;overflow-x:auto;padding-bottom:6px}
.week .card{padding:14px;border-top-width:5px;font-size:clamp(15px,1.2vw,22px);display:grid;grid-template-rows:subgrid;row-gap:0;align-content:start}
.week .sec{margin-top:10px}
.week .theme{margin-top:10px}
.week .card.today{border-color:#fff;border-top-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.week .date{font-size:28px}
.week .cycle b{font-size:28px}
.week .sec h3{font-size:18px}
.week .theme strong{font-size:19px}
.hide{display:none}
@media (min-width:1000px){.week{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tl{margin:0 0 2px;font:700 22px "Barlow Condensed",sans-serif;color:#fff}
.week .tl{font-size:18px}
.one{font-size:clamp(19px,1.7vw,30px)}
.one .date{font-size:1.8em}
.one .cycle{font-size:.75em}
.one .cycle b{font-size:3.3em}
.one .tl{font-size:1.3em}
.one .theme strong{font-size:1.6em}
.one .theme span{font-size:.8em}
.one .attire{font-size:.7em}
.one .sec h3{font-size:1.4em}
.one .sec .t{font-size:.8em}
.one .sec li{padding:.2em 0}
.note{color:var(--mute);font-size:13px;padding:0 24px 20px}
.one .attire{font-size:1em;color:var(--ink);font-weight:600}
.one .theme span{font-size:1em;color:var(--ink)}
.one .sec .t{font-size:1.25em;font-weight:700}
.gl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0 14px;overflow-x:auto}
@media (max-width:999px){.gl{grid-template-columns:repeat(5,minmax(240px,1fr))}}
.gl .card{display:grid;grid-row:span 7;grid-template-rows:subgrid;row-gap:0;align-content:start;font-size:clamp(17px,1.5vw,28px)}
.gl .card.today{border-color:#fff;border-top-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.gl .date{font-size:1.7em}
.gl .date small{display:block;font:600 .45em "Source Sans 3",sans-serif;color:var(--mute);margin-top:2px}
.gl .cycle{font-size:.5em}
.gl .cycle b{font-size:2.4em}
.gl .theme{margin-top:12px}
.gl .tl{font-size:1em}
.gl .theme strong{font-size:1.25em}
.gl .attire{font-weight:600;color:var(--ink);font-size:.9em}
.gl .sec{margin-top:12px}
.gl .sec h3{font-size:1.15em}
.gl .sec .t{font-size:1.2em;font-weight:700}
.gl .sp{background:rgba(221,85,12,.28)}
.gl .big{font-size:1.2em;font-weight:600}
</style>
</head>
<body>
<header>
  <h1 id="title">Happening today</h1>
  <div class="tabs" id="tabs" role="group" aria-label="View"></div>
</header>
<main id="out"></main>
<p class="note" id="note"></p>
<script>
// Data the server already read in doGet, so the page draws immediately.
var DAYS = <?!= days ?>;
var PARAMS = <?!= params ?>;
var SLOTS=[];
function computeSlots(){SLOTS=[];DAYS.forEach(function(d){if(d.secs){d.secs.forEach(function(x){if(SLOTS.indexOf(x[0])<0)SLOTS.push(x[0])})}})}
var q={get:function(k){return PARAMS[k]||null}};
var now=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
var real=-1, sel=0, view=q.get("view")==="week"?"week":(q.get("view")==="glance"?"glance":"today");
if(q.get("bg")==="clear")document.body.className="clear";
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function card(d,i,small){
  if(!d) return '';
  var h='<article class="card'+(i===real?' today':'')+(small?'':' one')+'"><div class="top"><div class="date">'+esc(d.label)+'</div><div class="cycle">CYCLE DAY<b>'+(d.cycle||"")+'</b></div></div>';
  var th=d.theme?d.theme:(d.special?[d.special,""]:null);
  if(th)h+='<div class="theme">'+(d.theme?'<h3 class="tl">'+esc(d.themeLabel||"")+'</h3>':'')+'<strong>'+esc(th[0])+'</strong>'+(th[1]?'<span>'+esc(th[1])+'</span>':'')+'</div>';
  h+='<p class="attire">Attire: '+esc(d.attire)+(d.note?'. '+esc(d.note):'')+'</p><div class="'+(small?'':'grid')+'">';
  if(d.secs){
    d.secs.forEach(function(s){
      h+='<section class="sec"><h3>'+esc(s[0])+'</h3>'+(s[1]?'<div class="t">'+esc(s[1])+'</div>':'')+'<ul>'+s[2].map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></section>';
    });
  }
  return h+'</div></article>';
}
function secHtml(s){return '<section class="sec"><h3>'+esc(s[0])+'</h3>'+(s[1]?'<div class="t">'+esc(s[1])+'</div>':'')+'<ul>'+s[2].map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></section>'}
function weekCard(d,i){
  var th=d.theme?d.theme:(d.special?[d.special,""]:null);
  var h='<article class="card'+(i===real?' today':'')+'" style="grid-row:span '+(3+SLOTS.length)+'"><div class="top"><div class="date">'+esc(d.label)+'</div><div class="cycle">CYCLE DAY<b>'+(d.cycle||"")+'</b></div></div>';
  h+=th?'<div class="theme">'+(d.theme?'<h3 class="tl">'+esc(d.themeLabel||"")+'</h3>':'')+'<strong>'+esc(th[0])+'</strong>'+(th[1]?'<span>'+esc(th[1])+'</span>':'')+'</div>':'<div></div>';
  h+='<p class="attire">Attire: '+esc(d.attire)+(d.note?'. '+esc(d.note):'')+'</p>';
  SLOTS.forEach(function(n){
    var s=d.secs?d.secs.find(function(x){return x[0]===n}):null;
    h+=s?secHtml(s):'<div></div>';
  });
  return h+'</article>';
}
var CYC={"1":"Community Meeting","2":"Advisory","3":"Clubs","4":"Class Meetings","6":"Advisory","7":"Clubs","8":"Clubs"};
function findSec(d,re){return d.secs?d.secs.find(function(x){return re.test(x[0])}):null}
function glanceCard(d,i){
  var p=d.label.split(", ");
  var h='<article class="card'+(i===real?' today':'')+'"><div class="top"><div class="date">'+esc(p[0])+'<small>'+esc(p[1]||"")+'</small></div><div class="cycle">CYCLE DAY<b>'+esc(d.cycle||"")+'</b></div></div>';
  h+=d.theme?'<div class="theme">'+(d.themeLabel?'<h3 class="tl">'+esc(d.themeLabel)+'</h3>':'')+'<strong>'+esc(d.theme[0])+'</strong>'+(d.theme[1]?'<span>'+esc(d.theme[1])+'</span>':'')+'</div>':'<div></div>';
  h+='<p class="attire">Attire: '+esc(d.attire)+'</p>';
  var m=findSec(d,/meeting/i),L=findSec(d,/^lunch/i),A=findSec(d,/after school/i),E=findSec(d,/evening/i);
  if(d.special&&m){h+='<section class="sec sp"><h3>Special schedule</h3><div class="big">'+esc(m[1]||d.special)+'</div></section>'}
  else if(m){var nm=CYC[d.cycle]||((m[2][0]||"Meeting").replace(/\s*[\u2013-].*$/,""));h+='<section class="sec"><h3>'+esc(nm)+'</h3>'+(m[1]?'<div class="t">'+esc(m[1])+'</div>':'')+'</section>'}
  else h+='<div></div>';
  var lt=L?L[1]:"";
  if(d.special&&m){var sl=m[2].filter(function(x){return /^lunch/i.test(x)})[0];if(sl)lt=sl.replace(/^lunch:?\s*/i,"").replace(/\s*-\s*/g," \u2013 ")}
  h+=lt?'<section class="sec"><h3>Lunch</h3><div class="t">'+esc(lt)+'</div></section>':'<div></div>';
  h+=A?secHtml(A):'<div></div>';
  h+=E?secHtml(E):'<div></div>';
  return h+'</article>';
}
function draw(){
  if (!DAYS || !DAYS.length) return;
  document.getElementById("title").textContent=view!=="today"?(view==="glance"?"Week at a glance: ":"This week: ")+DAYS[0].label.split(", ")[1]+" – "+DAYS[DAYS.length-1].label.split(", ")[1]:"Happening today";
  document.getElementById("out").innerHTML=view==="glance"?'<div class="gl">'+DAYS.map(glanceCard).join("")+'</div>':view==="week"
    ?'<div class="week">'+DAYS.map(weekCard).join("")+'</div>'
    :card(DAYS[sel],sel,false);
  var t=document.getElementById("tabs");t.innerHTML="";
  function b(txt,on,fn){var e=document.createElement("button");e.textContent=txt;e.setAttribute("aria-pressed",on);e.onclick=fn;t.appendChild(e)}
  b("Today",view==="today",function(){view="today";draw()});
  b("Glance",view==="glance",function(){view="glance";draw()});
  b("Week detail",view==="week",function(){view="week";draw()});
  if(view==="today")DAYS.forEach(function(d,i){b(d.label.split(",")[0].slice(0,3),sel===i,function(){sel=i;draw()})});
  document.getElementById("note").textContent=real<0&&view==="today"?"Preview mode: showing "+DAYS[sel].label+". The live version picks today’s column automatically.":"";
  fit();
  postHeight();
}
// Tell the wrapper page (github.io) how tall the schedule is, so on phones it
// can size the frame to fit and there is no inner scrollbar.
function postHeight(){
  try{
    var n=document.getElementById("note");
    var h=Math.ceil(n.getBoundingClientRect().bottom+window.scrollY);
    window.top.postMessage({type:"schedHeight",height:h},"*");
  }catch(e){}
}
function fit(){var o=document.getElementById("out"),z=1;o.style.zoom=1;if(window.innerWidth<900)return;while(z>(view==="today"?0.55:0.7)&&document.documentElement.scrollHeight>window.innerHeight+1){z-=0.02;o.style.zoom=z}}
window.addEventListener("resize",function(){fit();postHeight()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(postHeight);
function refresh(){if(typeof google==="undefined"||!google.script)return;
  google.script.run.withSuccessHandler(function(d){
    if(d&&d.length){DAYS=d;computeSlots()}
    now=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
    real=DAYS.findIndex(function(x){return x.label===now});
    if(real>=0)sel=real;else if(sel>=DAYS.length)sel=0;
    draw();
  }).getDays();}

// First paint from the server-provided data, no waiting.
computeSlots();
real=DAYS.findIndex(function(x){return x.label===now});
if(real>=0)sel=real;
draw();

// Then keep it fresh: re-read the doc every 5 minutes.
setInterval(refresh, 300000);
</script>
</body>
</html>
