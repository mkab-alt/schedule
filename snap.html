<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a picture · TH Planner</title>
<link rel="icon" type="image/png" href="https://mkab-alt.github.io/schedule/apple-touch-icon.png">
<link rel="apple-touch-icon" href="https://mkab-alt.github.io/schedule/apple-touch-icon.png">
<!-- TH Planner (build 83): the page the "Use my phone" QR code opens. It sends each picture to the planner's
     PUBLIC Apps Script deployment in the background (doPost), so the phone never opens a Google page.
     (Opening Apps Script pages directly fails on phones signed in to more than one Google account:
     "Sorry, unable to open the file at this time.") The code in the address (?c=...) works for 20 minutes,
     for one event card only. Nothing else about the planner is reachable from here. -->
<style>
body{margin:0;background:#03244d;color:#f4f6fa;font:400 18px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:460px;margin:0 auto;padding:22px 20px 40px}
.brand{color:#ff8a3d;font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:uppercase}
h1{font-size:28px;margin:6px 0 4px}
.ev{margin:0 0 22px;color:#a9b8cf}.ev b{color:#f4f6fa}
label.big,label.ghost{display:block;text-align:center;border-radius:12px;padding:18px;font-weight:700;font-size:21px;cursor:pointer;margin-bottom:12px}
label.big{background:#dd550c;color:#fff}label.ghost{border:1px solid #1d4478;font-size:17px;padding:13px}
input#cap{width:100%;box-sizing:border-box;background:#0a3366;color:#f4f6fa;border:1px solid #1d4478;border-radius:8px;padding:12px;font-size:17px;margin-top:4px}
#msg{min-height:1.4em;margin:16px 0 8px}#msg.ok{color:#9be7a5}#msg.err{color:#ffd166}
#done{display:flex;flex-wrap:wrap;gap:8px}#done img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #1d4478}
.small{color:#a9b8cf;font-size:14px;margin-top:22px}
.busy label{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<main>
  <div class="brand">TH Planner</div>
  <div id="app"><h1>Add a picture</h1><p class="ev">Checking the code…</p></div>
</main>
<script>
// The planner's PUBLIC deployment (the same address the phone apps use)
var EXEC = "https://script.google.com/macros/s/AKfycbwpQ3JC07Jm3E2XTtWthj5KYtJz1CUtgQcnaCVD1bxb7T-U_IIczg6g2PXbvulnAnkTJA/exec";
var CODE = (new URLSearchParams(location.search).get("c") || "").replace(/[^0-9a-f]/g, "");
var app = document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function expired(){
  app.innerHTML='<h1>This code has run out</h1><p>Phone codes work for 20 minutes. On the laptop, open the event card, tap 📷 Add picture, then <b>Use my phone</b> for a new code.</p>';
}
function jpeg(img,max,q){
  var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(1,max/Math.max(w,h));
  var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}
function prep(file,cb){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    URL.revokeObjectURL(url);
    try{
      var big=jpeg(img,1600,0.82),th="";
      [[360,0.6],[300,0.5],[240,0.45]].some(function(z){th=jpeg(img,z[0],z[1]);return th.length<44000});
      cb(null,{data:big.split(",")[1],thumb:th.length<44000?th:""});
    }catch(e){cb("That picture couldn’t be read.")}
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb("That file couldn’t be opened as a picture.")};
  img.src=url;
}
// Sent as plain text so the browser doesn't need Google's permission first; Apps Script reads it in doPost
function post(body){
  return fetch(EXEC,{method:"POST",body:JSON.stringify(body),headers:{"Content-Type":"text/plain;charset=utf-8"}})
    .then(function(r){return r.json()});
}
function start(info){
  app.innerHTML='<h1>Add a picture</h1><p class="ev">to <b>'+esc(info.title||"this event")+'</b>'+(info.when?' · '+esc(info.when):'')+'</p>'+
    '<label class="big" for="cam">📷 Take picture</label><input id="cam" type="file" accept="image/*" capture="environment" hidden>'+
    '<label class="ghost" for="lib">Choose from my photos</label><input id="lib" type="file" accept="image/*" multiple hidden>'+
    '<input id="cap" maxlength="200" placeholder="What is it? (optional)" aria-label="What is it? (optional)">'+
    '<p id="msg" role="status"></p><div id="done"></div>'+
    '<p class="small">Pictures go on the event’s card in the TH Planner, where the planning team can see them. This page works for '+(info.mins||20)+' minutes.</p>';
  var msg=document.getElementById("msg"),done=document.getElementById("done");
  function say(t,cls){msg.className=cls||"";msg.textContent=t}
  function send(files){
    files=Array.prototype.slice.call(files||[],0,6);
    if(!files.length)return;
    var cap=document.getElementById("cap").value,i=0;
    app.classList.add("busy");
    (function next(){
      if(i>=files.length){document.getElementById("cap").value="";app.classList.remove("busy");return}
      say("Sending"+(files.length>1?" "+(i+1)+" of "+files.length:"")+"…");
      prep(files[i],function(err,r){
        if(err){say(err,"err");app.classList.remove("busy");return}
        post({snap:CODE,data:r.data,thumb:r.thumb,cap:cap}).then(function(res){
          if(!res||res.error){say("Couldn’t send it: "+((res&&res.error)||"no answer"),"err");app.classList.remove("busy");return}
          if(r.thumb)done.insertAdjacentHTML("beforeend",'<img alt="" src="'+r.thumb+'">');
          say("✓ "+(res.n>1?res.n+" pictures are":"It’s")+" on the card now. Take another, or you’re done.","ok");
          i++;next();
        }).catch(function(){say("Couldn’t send it. Check the phone’s internet connection and try again.","err");app.classList.remove("busy")});
      });
    })();
  }
  ["cam","lib"].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener("change",function(){var f=Array.prototype.slice.call(el.files||[]);el.value="";send(f)});
  });
}
if(!/^[0-9a-f]{20}$/.test(CODE))expired();
else fetch(EXEC+"?snapinfo="+CODE).then(function(r){return r.json()}).then(function(info){
  if(info&&info.ok)start(info);else expired();
}).catch(function(){app.innerHTML='<h1>Add a picture</h1><p>Couldn’t reach the planner. Check the phone’s internet connection and reload this page.</p>'});
</script>
</body>
</html>
