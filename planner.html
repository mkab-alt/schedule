<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TH Planner</title>
<!-- TH Planner launcher (your live schedule.html is not touched). Four doors:
     planner.html                -> the planner (school sign-in). Leads/Team: full planner; other staff: public look.
     planner.html?display        -> no sign-in, full screen: schedule, event titles and times. Signs, TVs, anyone's phone.
     planner.html?team=KEY       -> no sign-in, full screen: everything, view-only. Planning team phones.
                                    (KEY is in the Leads tab, cell D2. Change it there to retire old links.)
     planner.html?bus=KEY        -> no sign-in, full screen: "TH Athletics", the bus drivers' app. Games, practices,
                                    bus details and their notes only. (KEY is in the Leads tab, cell J2.)
                                    Add &driver=Name to open on one driver's runs, &view=week for the week list.
     add &view=today|glance|week|planning to pick the view; add &setup for "Add to Home Screen" steps.
     planner.html?setup          -> steps for putting the SIGNED-IN planner on a phone (works best in Chrome). -->
<meta name="apple-mobile-web-app-title" content="TH Planner" id="apptitle">
<meta name="apple-mobile-web-app-capable" content="yes" id="appcap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Home Screen icons: planner-icon.png (navy, everyone), planner-icon-team.png (orange, team link) and
     planner-icon-bus.png (the bus, drivers' link). apple-touch-icon.png stays as is for the live schedule app. -->
<link rel="apple-touch-icon" href="https://mkab-alt.github.io/schedule/planner-icon.png" id="appicon">
<link rel="icon" type="image/png" href="https://mkab-alt.github.io/schedule/monarch2.png">
<meta name="theme-color" content="#03244d">
<style>
  html, body { margin: 0; height: 100%; background: #03244d; color: #f4f6fa;
    font: 17px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  /* The planner fills the screen below the status bar (no gaps top or bottom) */
  main { max-width: 460px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  .card { background: #0a3366; border: 1px solid #1d4478; border-top: 5px solid #dd550c; border-radius: 12px; padding: 16px 18px; margin-top: 16px; }
  ol { margin: 8px 0 0; padding-left: 22px; }
  li { margin: 6px 0; }
  .mute { color: #a9b8cf; font-size: 14px; }
  .ver { display: inline-block; margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: #ff8a3d; border: 1px solid #dd550c; border-radius: 12px; padding: 3px 10px; }
  a { color: #ff8a3d; }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 30vh; text-align: center; }
  .spin { width: 34px; height: 34px; border: 4px solid #1d4478; border-top-color: #dd550c; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

  /* ===== Loading screens (launcher build 19): an outline of the page that's coming, plus a little animation ===== */
  #ld{position:fixed;inset:0;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
  #ld *{box-sizing:border-box}
  #ld .sk{background:linear-gradient(90deg,#123d72 0%,#1b4b86 45%,#123d72 90%);background-size:300% 100%;animation:ldshim 1.6s linear infinite;border-radius:8px}
  @keyframes ldshim{from{background-position:100% 0}to{background-position:-200% 0}}
  #ld .ldmsg{text-align:center;color:#a9b8cf;font-size:15px;font-weight:600;letter-spacing:.02em;margin:10px auto 14px;position:relative;background:#03244d;padding:4px 14px;border-radius:14px;width:max-content;max-width:92%}
  #ld .ldmsg span span{animation:lddot 1.2s infinite;opacity:.2}#ld .ldmsg span span:nth-child(2){animation-delay:.2s}#ld .ldmsg span span:nth-child(3){animation-delay:.4s}
  @keyframes lddot{0%,60%,100%{opacity:.2}30%{opacity:1}}
  #ld .ldslow{text-align:center;color:#a9b8cf;font-size:14px;margin:0 16px}
  #ld .top{padding:14px 14px 9px;border-bottom:1px solid #1d4478}
  #ld .row{display:flex;align-items:center;gap:8px}
  #ld h1{font-size:22px;margin:0;flex:1}
  #ld .seg{display:flex;border:1px solid #1d4478;border-radius:9px;overflow:hidden}
  #ld .seg b{padding:6px 15px;font-size:15px;font-weight:600;color:#a9b8cf}#ld .seg b.on{background:#dd550c;color:#fff}
  #ld .days{display:flex;gap:5px;margin-top:10px}
  #ld .days b{flex:1;text-align:center;padding:6px 0 5px;border-radius:9px;border:1px solid #1d4478;font-size:13px;font-weight:600;color:#a9b8cf;line-height:1.15}
  #ld .days b small{display:block;font-weight:400;font-size:11px}#ld .days b.on{background:#dd550c;border-color:#dd550c;color:#fff}
  #ld .pills{display:flex;gap:6px;margin-top:10px}#ld .pills i{display:block;height:30px;border-radius:20px}
  #ld .road{position:relative;height:168px;margin-top:18px;overflow:hidden}
  #ld .road .ln{position:absolute;left:0;right:0;bottom:22px;height:4px;background:repeating-linear-gradient(90deg,#f6c344 0 24px,transparent 24px 48px);opacity:.55;animation:ldroll .5s linear infinite}
  #ld .road .gr{position:absolute;left:0;right:0;bottom:0;height:24px;background:#021a38}
  @keyframes ldroll{from{background-position:0 0}to{background-position:-48px 0}}
  #ld .busrun{position:absolute;bottom:14px;left:0;animation:lddrive 3s linear infinite}
  @keyframes lddrive{from{transform:translateX(-230px)}to{transform:translateX(calc(100vw + 10px))}}
  #ld .bus .body{animation:ldbump .32s ease-in-out infinite alternate}
  @keyframes ldbump{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
  #ld .bus .wheel{animation:ldspin .55s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ldspin{to{transform:rotate(360deg)}}
  #ld .speed{position:absolute;left:-26px;top:30px;display:flex;flex-direction:column;gap:9px}#ld .speed i{display:block;height:3px;border-radius:2px;background:#fff;opacity:.35}
  #ld .cards{padding:4px 12px;max-width:640px;margin:0 auto}
  #ld .tcard{display:flex;gap:10px;background:#0a3366;border:1px solid #1d4478;border-left:5px solid #f6c344;border-radius:12px;padding:12px;margin-bottom:10px}
  #ld .tcard .lv{width:66px;height:62px}#ld .tcard .bd{flex:1;display:flex;flex-direction:column;gap:9px}
  #ld .page{padding:14px 12px;position:relative;max-width:900px;margin:0 auto}
  #ld .day{background:#0a3366;border:1px solid #1d4478;border-top:5px solid #dd550c;border-radius:12px;padding:16px;opacity:.55}
  #ld .blk{border-left:5px solid #dd550c;background:#123d72;border-radius:8px;padding:10px;margin-top:10px}
  #ld .over{position:absolute;left:0;right:0;top:20px;display:flex;flex-direction:column;align-items:center}
  #ld .halo{position:absolute;top:-14px;width:330px;height:330px;border-radius:50%;background:radial-gradient(#03244d 40%,transparent 70%)}
  #ld .clip{position:relative}
  #ld .revrect{animation:ldrev 4.0s linear infinite}
  @keyframes ldrev{0%{height:0}36.25%,100%{height:104px}}
  #ld .art{animation:ldart 4.0s linear infinite}
  @keyframes ldart{0%,90.00%{opacity:1}96.25%,100%{opacity:0}}
  #ld .pencil{animation:ldpen 4.0s linear infinite}
  @keyframes ldpen{0.00%{transform:translate(60px,48px);opacity:1}5.00%{transform:translate(140px,60px);opacity:1}10.00%{transform:translate(60px,74px);opacity:1}15.00%{transform:translate(140px,88px);opacity:1}20.00%{transform:translate(60px,102px);opacity:1}25.00%{transform:translate(140px,116px);opacity:1}30.00%{transform:translate(62px,130px);opacity:1}36.25%{transform:translate(140px,142px);opacity:1}43.75%{transform:translate(46px,162px);opacity:1}47.50%{transform:translate(49px,166px);opacity:1}51.25%{transform:translate(57px,157px);opacity:1}57.50%{transform:translate(46px,182px);opacity:1}61.25%{transform:translate(49px,186px);opacity:1}65.00%{transform:translate(57px,177px);opacity:1}71.25%{transform:translate(46px,202px);opacity:1}75.00%{transform:translate(49px,206px);opacity:1}78.75%{transform:translate(57px,197px);opacity:1}87.50%{transform:translate(178px,226px);opacity:1}100.00%{transform:translate(178px,226px);opacity:0}}
  #ld .ck{stroke-dasharray:20}
  #ld .r1 .ck{animation:ldc1 4.0s linear infinite}@keyframes ldc1{0%,43.75%{stroke-dashoffset:20;opacity:1}51.25%,90.00%{stroke-dashoffset:0;opacity:1}96.25%,100%{stroke-dashoffset:0;opacity:0}}
  #ld .r2 .ck{animation:ldc2 4.0s linear infinite}@keyframes ldc2{0%,57.50%{stroke-dashoffset:20;opacity:1}65.00%,90.00%{stroke-dashoffset:0;opacity:1}96.25%,100%{stroke-dashoffset:0;opacity:0}}
  #ld .r3 .ck{animation:ldc3 4.0s linear infinite}@keyframes ldc3{0%,71.25%{stroke-dashoffset:20;opacity:1}78.75%,90.00%{stroke-dashoffset:0;opacity:1}96.25%,100%{stroke-dashoffset:0;opacity:0}}
  #ld .mpop{transform-box:fill-box;transform-origin:50% 60%;animation:ldpop 4.0s ease-out infinite}
  @keyframes ldpop{0%,36.25%{transform:scale(1)}40.00%{transform:scale(1.09) rotate(-2deg)}43.75%{transform:scale(.98)}46.25%,100%{transform:scale(1)}}
  #ld .spk path{transform-box:fill-box;transform-origin:center;animation:ldtw 4.0s ease-out infinite;opacity:0}
  #ld .s1 path{animation-delay:.12s}#ld .s2 path{animation-delay:.24s}
  @keyframes ldtw{0%,37.50%{transform:scale(0) rotate(0);opacity:0}42.50%{transform:scale(1.2) rotate(45deg);opacity:1}52.50%,100%{transform:scale(0) rotate(90deg);opacity:0}}
  @media (prefers-reduced-motion: reduce) { #ld *{animation-duration:8s !important} }
</style>
</head>
<body>
<main id="msg"><div class="loading"><div class="spin" aria-hidden="true"></div><div id="opening">Opening TH Planner…</div><div class="mute" id="slow"></div></div></main>
<p class="mute" id="lbuild" style="position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;opacity:.6;margin:0">launcher build 20</p>

  // The planner, with school sign-in (Planning team deployment):

  // No sign-in (Public deployment, "Who has access: Anyone"), used by ?display, ?team=KEY and ?bus=KEY:
  var PUBLIC_URL = "https://script.google.com/macros/s/AKfycbwpQ3JC07Jm3E2XTtWthj5KYtJz1CUtgQcnaCVD1bxb7T-U_IIczg6g2PXbvulnAnkTJA/exec";

  // Self-update: home-screen apps can hold on to an old copy of this page. Check GitHub for a newer
  // launcher build; if there is one, refresh the saved copy and reload once.
  var LAUNCHER_BUILD = 20;
  try {
    fetch(location.pathname, { cache: "reload" }).then(function (r) { return r.text(); }).then(function (t) {
      var m = /var LAUNCHER_BUILD = (\d+)/.exec(t);
      if (m && +m[1] > LAUNCHER_BUILD && sessionStorage.getItem("thLauncherReloaded") !== m[1]) {
        sessionStorage.setItem("thLauncherReloaded", m[1]);
        location.reload();
      }
    }).catch(function () {});
  } catch (e) {}

  var q = new URLSearchParams(location.search);
  var setup = q.has("setup"), display = q.has("display"), key = q.get("team") || "", bus = q.get("bus") || "";
  q.delete("setup"); q.delete("display"); q.delete("team"); q.delete("bus");
  var rest = q.toString();                 // ?view=, ?card= and ?driver= pass straight through
  var phone = display || key || bus;       // the three no-sign-in, full-screen doors
  var msg = document.getElementById("msg");
  var embedded = false;
  try { embedded = window.top !== window.self; } catch (e) { embedded = true; }

  if (key) {
    document.getElementById("apptitle").setAttribute("content", "TH Planner Team");
    document.title = "TH Planner Team";
    document.getElementById("appicon").setAttribute("href", "https://mkab-alt.github.io/schedule/planner-icon-team.png");
  }
  if (bus) {
    document.getElementById("apptitle").setAttribute("content", "TH Athletics");
    document.title = "TH Athletics";
    document.getElementById("appicon").setAttribute("href", "https://mkab-alt.github.io/schedule/planner-icon-bus.png");
    document.getElementById("opening").textContent = "Opening TH Athletics…";
  }
  if (!phone) { var cap = document.getElementById("appcap"); cap.parentNode.removeChild(cap); }

        '<div class="sk" style="height:16px;width:' + w + '%"></div><div class="sk" style="height:13px;width:' + (w - 22) + '%"></div>' + (faded ? '' : '<div class="sk" style="height:13px;width:' + (w - 42) + '%"></div>') + '</div></div>'; };
      el.innerHTML = '<div class="top"><div class="row"><h1>TH Athletics</h1><div class="sk" style="width:86px;height:28px"></div></div>' +
        '<div class="row" style="margin-top:10px"><div class="seg"><b class="on">Day</b><b>Week</b></div><div class="sk" style="margin-left:auto;width:118px;height:30px"></div></div>' +
        '<div class="days">' + days + '</div><div class="pills"><i class="sk" style="width:52px"></i><i class="sk" style="width:58px"></i><i class="sk" style="width:70px"></i><i class="sk" style="width:62px"></i></div></div>' +
        '<div class="road"><div class="gr"></div><div class="ln"></div><div class="busrun"><div class="speed"><i style="width:18px"></i><i style="width:12px"></i><i style="width:20px"></i></div>' + BUS_SVG.replace("__M__", MASCOT) + '</div></div>' +
        '<p class="ldmsg">' + pick(["Checking the bus schedule", "Warming up the bus", "Pumping up the tires", "Checking the game times", "Finding a parking spot"]) + dots() + '</p>' +
        '<p class="ldslow" id="slow"></p><div class="cards">' + card(92) + card(80) + card(85, true) + '</div>';
    } else {
      var blk = function (a, b, c) { return '<div class="blk"><div class="sk" style="height:18px;width:' + a + '%"></div><div class="sk" style="height:13px;width:' + b + '%;margin-top:9px"></div>' +
        (c ? '<div class="sk" style="height:13px;width:' + c + '%;margin-top:7px"></div>' : '') + '</div>'; };
      el.innerHTML = '<div class="top"><h1>' + (kind === "team" ? "TH Planner Team" : "TH Planner") + '</h1><div class="pills"><i class="sk" style="width:62px;border-radius:9px"></i><i class="sk" style="width:66px;border-radius:9px"></i><i class="sk" style="width:96px;border-radius:9px"></i><i class="sk" style="width:80px;border-radius:9px"></i></div></div>' +
        '<div class="page"><div class="day"><div class="sk" style="height:22px;width:62%"></div><div class="sk" style="height:14px;width:40%;margin-top:10px"></div>' +
        blk(40, 75) + blk(34, 62, 50) + blk(46, 70) + blk(30, 55) + blk(38, 66) + '</div>' +
        '<div class="over"><div class="halo"></div>' + CLIP_SVG.replace('<g class="art"></g>', '<g class="art">' + clipArt() + '</g>') +
        '<p class="ldmsg" style="margin-top:12px">' + pick(["Getting today’s plan ready", "Rounding up the events", "Checking the calendar", "Sharpening pencils", "Lining up the schedule", "Counting the chairs"]) + dots() + '</p>' +
        '<p class="ldslow" id="slow"></p></div></div>';
    }
    msg.style.display = "none";
    var old = document.getElementById("slow"); if (old && old.parentNode) old.parentNode.removeChild(old);
    document.body.appendChild(el);
  }

  var door = location.pathname + (display ? "?display" : (key ? "?team=" + encodeURIComponent(key) :
             (bus ? "?bus=" + encodeURIComponent(bus) + (q.get("driver") ? "&driver=" + encodeURIComponent(q.get("driver")) : "") : "")));

  if (setup && phone) {
    history.replaceState(null, "", door);   // so the Home Screen icon saves the plain link
    var appName0 = key ? "TH Planner Team" : (bus ? "TH Athletics" : "TH Planner");
    msg.innerHTML =
      '<p class="ver">' + (key ? 'Planning team · view-only' : (bus ? 'Athletics · bus schedule' : 'Schedule & events')) + '</p>' +
      (key || bus ? '<p class="mute">Tip: if the Add screen names it “TH Planner”, you can rename it “' + appName0 + '” there.</p>' : '') +
      '<h1>Add ' + appName0 + ' to your Home Screen</h1>' +
      '<p class="mute">' + (key ? 'Everything the planning team sees: events, quick events, notes and 1-pagers. No sign-in. ' +
                                  'Please don’t share this link outside the planning team.'
                                : (bus ? 'Games, practices and bus runs, with departure times and drivers. No sign-in.'
                                       : 'The schedule and upcoming events. No sign-in needed.')) + '</p>' +
      '<div class="card"><b>On iPhone:</b><ol>' +
      '<li>Tap the <b>Share</b> button (square with an arrow).</li>' +
      '<li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>' +
      '<li>From now on, open it by tapping the new icon.</li></ol>' +
      '<p class="mute" style="margin:10px 0 0">On Android (Chrome): tap <b>⋮</b> › <b>Add to Home screen</b>.</p></div>' +
      '<p class="mute" style="margin-top:18px">Just want to look now? <a href="' + door + '">Open it now</a>.</p>';
  } else if (setup) {
    // Main door on a phone: works smoothly from Chrome (it reuses Chrome's school sign-in)
    history.replaceState(null, "", location.pathname);   // so the icon saves the plain link
    var inChrome = /CriOS|Chrome/.test(navigator.userAgent);
    msg.innerHTML =
      '<p class="ver">Planning team · full planner</p>' +
      '<h1>Add the TH Planner to your Home Screen</h1>' +
      '<p class="mute">The full planner: notes, quick events, Ask someone and Seen. Uses your school sign-in.</p>' +
      (inChrome ? '' :
        '<div class="card"><b>Please use Chrome for this one.</b> In Safari, the school sign-in opens extra windows. ' +
        'Open this page in <b>Chrome</b> (signed in to your trinityhallnj.org account):<br>' +
        '<span class="mute" style="word-break:break-all">' + location.origin + location.pathname + '?setup</span></div>') +
      '<div class="card"><b>In Chrome on iPhone:</b><ol>' +
      '<li>Make sure Chrome is signed in to your <b>trinityhallnj.org</b> account.</li>' +
      '<li>Tap <b>Open the planner</b> below and wait for it to load.</li>' +
      '<li><b>On the planner itself</b>, tap the <b>Share</b> button (in the address bar or the ⋯ menu), ' +
          'then <b>Add to Home Screen</b> › <b>Add</b>.</li>' +
      '<li>From now on, open it by tapping the new icon.</li></ol>' +
      '<p class="mute" style="margin:10px 0 0">Adding it from the planner (not this page) keeps it clean, with no extra bars.</p></div>' +
      '<a class="btn" style="display:inline-block;margin-top:16px;background:#dd550c;color:#fff;text-decoration:none;font-weight:600;padding:11px 18px;border-radius:8px" href="' +
          TEAM_URL + '">Open the planner</a>';
  } else if (!phone) {
    // Main door: the planner with school sign-in
    var target = TEAM_URL + (rest ? "?" + rest : "");
    if (embedded) { msg.innerHTML = '<main><p><a href="' + target + '" target="_blank">Open TH Planner</a></p></main>'; }
    else {
      // The same clipboard screen the signed-in planner shows next, so the hand-off looks like one screen
      showLoading("display");
      location.replace(target);
      setTimeout(function () {
        var sl = document.getElementById("slow"); if (sl) sl.innerHTML = 'Taking a while? <a href="' + target + '">Tap here</a>.';
      }, 12000);
    }
  } else {
    // No-sign-in doors: fetch the planner page and make it THIS page (not a frame inside it), so it fills
    // the phone screen edge to edge and scrolls behind the clock exactly like the schedule app.
    var extra = (key ? "&team=" + encodeURIComponent(key) : "") + (bus ? "&bus=" + encodeURIComponent(bus) : "") + (rest ? "&" + rest : "");
    var CACHE_KEY = "thPlanner:" + (key ? "team" : (bus ? "bus" : "display"));
    var js = function (v) { return JSON.stringify(v).replace(/</g, "\\u003c"); };
    var icon = document.getElementById("appicon").getAttribute("href");
    var appName = key ? "TH Planner Team" : (bus ? "TH Athletics" : "TH Planner");
    var shown = false;
    var show = function (html, fromCache) {
      shown = true;
      // What the planner page needs to act as a home-screen app, plus a little helper it uses to
      // fetch fresh data and 1-pagers (no sign-in; the team or bus key goes along)
      var head =
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
        '<meta name="apple-mobile-web-app-title" content="' + appName + '">' +
        '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
        '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">' +
        '<link rel="apple-touch-icon" href="' + icon + '">' +
        '<link rel="icon" type="image/png" href="https://mkab-alt.github.io/schedule/monarch2.png">' +
        '<meta name="theme-color" content="#03244d">' +
        '<script>window.thPlannerHost={url:' + js(PUBLIC_URL) + ',team:' + js(key) + ',bus:' + js(bus) + ',cacheKey:' + js(CACHE_KEY) +
          ',fromCache:' + (fromCache ? 'true' : 'false') + ',page:' + js(PUBLIC_URL + "?format=html" + extra) + ',' +
          'data:function(cb){fetch(this.url+"?format=json"+(this.team?"&team="+encodeURIComponent(this.team):"")+(this.bus?"&bus="+encodeURIComponent(this.bus):""),{cache:"no-store"})' +
            '.then(function(r){return r.json()}).then(cb).catch(function(){cb(null)})},' +
          'onePager:function(id,cb){fetch(this.url+"?format=json&team="+encodeURIComponent(this.team)+"&onepager="+encodeURIComponent(id)).then(function(r){return r.json()})' +
            '.then(function(d){cb(d&&d.error||null,d)}).catch(function(){cb("couldn\\u2019t reach the planner")})},' +
          'savePage:function(){var k=this.cacheKey;fetch(this.page).then(function(r){return r.ok?r.text():""}).then(function(h){if(/TH Planner/.test(h))try{localStorage.setItem(k,h)}catch(e){}}).catch(function(){})}' +
        '};' + (embedded ? 'window.EMBEDDED=true;' : '') + '<\/script>';
      html = html.replace("<head>", "<head>" + head);
      // Replace this page with the planner. (Wait until this page has finished loading: before that,
      // the browser would add the planner underneath the loading screen instead of replacing it.)
      var swap = function () { document.open(); document.write(html); document.close(); };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(swap, 0); });
      else setTimeout(swap, 0);
    };
    var cached = null;
    // The drivers' app reads &driver= and &view= from the address itself, so its saved copy works for every link
    try { if (!rest || bus) cached = localStorage.getItem(CACHE_KEY); } catch (e) {}
    // A copy saved by an older version can't refresh itself, so start fresh instead
    if (cached && cached.indexOf("thPlannerHost") < 0) cached = null;
    // Launcher build 20: every open shows the loading screen while a FRESH copy of the page is fetched
    // (so the page opens with current information). The copy saved last time is the fallback: it's
    // used if the fresh one takes more than 5 seconds or can't be reached (it then updates itself).
    showLoading(bus ? "bus" : (key ? "team" : "display"));
    var settled = false;
    var useSaved = function () { if (settled || !cached) return false; settled = true; show(cached, true); return true; };
    if (cached) setTimeout(useSaved, 5000);
    // Still loading after 12 seconds (and no saved copy)? Say so, with a way to try again
    setTimeout(function () { var sl = document.getElementById("slow"); if (!shown && sl && !sl.innerHTML) sl.innerHTML = 'Still working on it\u2026 <a href="' + location.href + '">Try again</a>'; }, 12000);
    fetch(PUBLIC_URL + "?format=html" + extra)
      .then(function (r) {
        if (!r.ok) throw new Error("the planner answered with error " + r.status);
        return r.text();
      })
      .then(function (html) {
        if (settled) return;   // the saved copy is already showing (it refreshes itself)
        if (!/TH Planner/.test(html)) {
          var t = (/<title>([^<]*)/i.exec(html) || [])[1] || html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").slice(0, 80);
          throw new Error("got \u201C" + t.trim() + "\u201D instead of the planner");
        }
        if (/"mode":\s*"public"/.test(html) && bus) { cached = null; try { localStorage.removeItem(CACHE_KEY); } catch (e) {} throw new Error("this drivers\u2019 link isn\u2019t valid anymore. Ask for the new one"); }
        settled = true;
        try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
        show(html, false);
      })
      .catch(function (err) {
        if (settled || useSaved()) return;
        var sl = document.getElementById("slow");
        if (sl) sl.innerHTML = 'Couldn\u2019t load ' + appName + ' (' + String(err && err.message || err).replace(/</g, "&lt;") +
          '). <a href="' + location.href + '">Try again</a>';
      });
  }
</script>
</body>
</html>
